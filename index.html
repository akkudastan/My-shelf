<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фиксация Посадки и Прилета</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; background: #eef2f5; max-width: 500px; margin: 0 auto; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-title { font-size: 22px; font-weight: bold; margin: 0; }
        
        .mode-toggle { display: flex; gap: 4px; background: #eee; padding: 4px; border-radius: 8px; margin-bottom: 12px; }
        .btn-mode { flex: 1; border: none; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; background: transparent; color: #666; transition: all 0.2s; }
        .btn-mode.active { background: #2196F3; color: white; }

        .lang-switch { display: flex; gap: 4px; background: #eee; padding: 3px; border-radius: 6px; }
        .btn-lang { border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; background: transparent; color: #666; }
        .btn-lang.active { background: #2196F3; color: white; }

        .top-actions { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-top { flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; }
        .btn-clear { background: #e53935; }
        .btn-undo { background: #757575; }
        .btn-redo { background: #009688; }

        label { font-weight: 600; display: block; margin-top: 10px; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .flight-row { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
        .type-toggle { display: flex; gap: 4px; background: #eee; padding: 3px; border-radius: 6px; }
        .btn-type { border: none; padding: 8px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; background: transparent; color: #666; }
        .btn-type.active { background: #2196F3; color: white; }

        .row { display: grid; grid-template-columns: 135px 65px 1fr 42px; align-items: center; gap: 8px; margin-bottom: 10px; }
        .row-short { grid-template-columns: 135px 65px 1fr 42px; }

        .btn-status { background: #4CAF50; color: white; border: none; padding: 11px 4px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; text-align: center; transition: background 0.2s; }
        .btn-status.active { background: #f44336; }
        
        .time-display { font-weight: bold; text-align: center; font-size: 14px; color: #111; display: inline-block; width: 100%; }
        .btn-copy { background: #ff9800; color: white; border: none; height: 38px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .btn-copy.copied { background: #4CAF50; }
        
        textarea { width: 100%; height: 140px; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; font-size: 13px; }
        .btn-report { background: #2196F3; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
        
        .bus-section { display: none; border-top: 1px dashed #ccc; padding-top: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-top">
        <div class="header-title" id="txt-title">Посадка</div>
        <div class="lang-switch">
            <button class="btn-lang active" id="lang-ru" onclick="setLanguage('ru')">RU</button>
            <button class="btn-lang" id="lang-kz" onclick="setLanguage('kz')">KZ</button>
            <button class="btn-lang" id="lang-en" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <!-- Переключатель режима: Посадка / Прилет -->
    <div class="mode-toggle">
        <button class="btn-mode active" id="mode-departure" onclick="setMode('departure')">ПОСАДКА</button>
        <button class="btn-mode" id="mode-arrival" onclick="setMode('arrival')">ПРИЛЕТ</button>
    </div>
    
    <div class="top-actions">
        <button class="btn-top btn-clear" id="txt-btnClear" onclick="clearAll()">Очистить всё</button>
        <button class="btn-top btn-undo" id="txt-btnUndo" onclick="undoLast()">Удалить действие</button>
        <button class="btn-top btn-redo" id="txt-btnRedo" onclick="redoLast()">Вернуть действие</button>
    </div>

    <label id="txt-lblClock">Часы (Местное / UTC):</label>
    <input type="text" id="liveClock" readonly style="background: #f0f0f0; font-weight: bold;">
    
    <label id="txt-lblFlight">Номер рейса и тип стоянки:</label>
    <div class="flight-row">
        <input type="text" id="flightNum" value="KC622" style="margin-top:0;" oninput="saveData()">
        <div class="type-toggle" id="typeToggleBox">
            <button class="btn-type active" id="btn-gate" onclick="setBoardingType('gate')">Гейт</button>
            <button class="btn-type" id="btn-remote" onclick="setBoardingType('remote')">Дальняя стоянка</button>
        </div>
    </div>
</div>

<div class="card">
    <!-- Блок статусов ДЛЯ ПОСАДКИ -->
    <div id="section-departure">
        <div class="row row-short">
            <button class="btn-status" id="btn-preboarding" onclick="recordTime('preboarding')">Пребординг</button>
            <span class="time-display" id="time-preboarding">--:--</span>
            <div></div>
            <button class="btn-copy" id="copy-btn-preboarding" onclick="copyLine('preboarding', this)">📋</button>
        </div>

        <div class="row row-short">
            <button class="btn-status" id="btn-full" onclick="recordTime('full')">Полная</button>
            <span class="time-display" id="time-full">--:--</span>
            <div></div>
            <button class="btn-copy" id="copy-btn-full" onclick="copyLine('full', this)">📋</button>
        </div>

        <div id="busBlockDeparture" class="bus-section">
            <div class="row row-short">
                <button class="btn-status" id="btn-busDep1" onclick="recordTime('busDep1')">1-й кобус уехал</button>
                <span class="time-display" id="time-busDep1">--:--</span>
                <div></div>
                <button class="btn-copy" id="copy-btn-busDep1" onclick="copyLine('busDep1', this)">📋</button>
            </div>
            <div class="row row-short">
                <button class="btn-status" id="btn-busDep2" onclick="recordTime('busDep2')">2-й кобус уехал</button>
                <span class="time-display" id="time-busDep2">--:--</span>
                <div></div>
                <button class="btn-copy" id="copy-btn-busDep2" onclick="copyLine('busDep2', this)">📋</button>
            </div>
            <div class="row row-short">
                <button class="btn-status" id="btn-busDep3" onclick="recordTime('busDep3')">3-й кобус уехал</button>
                <span class="time-display" id="time-busDep3">--:--</span>
                <div></div>
                <button class="btn-copy" id="copy-btn-busDep3" onclick="copyLine('busDep3', this)">📋</button>
            </div>
        </div>

        <div id="markContainerDeparture"></div>

        <div class="row">
            <button class="btn-status" id="btn-allAboard" onclick="recordTime('allAboard')">Все на борту</button>
            <span class="time-display" id="time-allAboard">--:--</span>
            <input type="text" id="comment-allAboard" placeholder="Комм." oninput="saveData()">
            <button class="btn-copy" id="copy-btn-allAboard" onclick="copyLine('allAboard', this)">📋</button>
        </div>

        <div class="row">
            <button class="btn-status" id="btn-closed" onclick="recordTime('closed')">Закрыли</button>
            <span class="time-display" id="time-closed">--:--</span>
            <input type="text" id="comment-closed" placeholder="Комм." oninput="saveData()">
            <button class="btn-copy" id="copy-btn-closed" onclick="copyLine('closed', this)">📋</button>
        </div>

        <label id="txt-lblChanges">Изменения:</label>
        <input type="text" id="changes" placeholder="-1 Asanov A." oninput="saveData()">
    </div>

    <!-- Блок статусов ДЛЯ ПРИЛЕТА -->
    <div id="section-arrival" style="display: none;">
        <div class="row">
            <button class="btn-status" id="btn-opened" onclick="recordTime('opened')">Открыли</button>
            <span class="time-display" id="time-opened">--:--</span>
            <input type="text" id="comment-opened" placeholder="Комм." oninput="saveData()">
            <button class="btn-copy" id="copy-btn-opened" onclick="copyLine('opened', this)">📋</button>
        </div>

        <div id="busBlockArrival" class="bus-section">
            <div class="row row-short">
                <button class="btn-status" id="btn-busArr1" onclick="recordTime('busArr1')">1-й кобус уехал</button>
                <span class="time-display" id="time-busArr1">--:--</span>
                <div></div>
                <button class="btn-copy" id="copy-btn-busArr1" onclick="copyLine('busArr1', this)">📋</button>
            </div>
            <div class="row row-short">
                <button class="btn-status" id="btn-busArr2" onclick="recordTime('busArr2')">2-й кобус уехал</button>
                <span class="time-display" id="time-busArr2">--:--</span>
                <div></div>
                <button class="btn-copy" id="copy-btn-busArr2" onclick="copyLine('busArr2', this)">📋</button>
            </div>
            <div class="row row-short">
                <button class="btn-status" id="btn-busArr3" onclick="recordTime('busArr3')">3-й кобус уехал</button>
                <span class="time-display" id="time-busArr3">--:--</span>
                <div></div>
                <button class="btn-copy" id="copy-btn-busArr3" onclick="copyLine('busArr3', this)">📋</button>
            </div>
        </div>

        <div id="markContainerArrival"></div>

        <div class="row">
            <button class="btn-status" id="btn-allOut" onclick="recordTime('allOut')">Все вышли</button>
            <span class="time-display" id="time-allOut">--:--</span>
            <input type="text" id="comment-allOut" placeholder="Комм." oninput="saveData()">
            <button class="btn-copy" id="copy-btn-allOut" onclick="copyLine('allOut', this)">📋</button>
        </div>

        <label id="txt-lblPaxCount">Количество пассажиров:</label>
        <input type="number" id="paxCount" placeholder="0" oninput="saveData()">
    </div>
</div>

<div class="card">
    <button class="btn-report" id="txt-btnReport" onclick="generateReport()">Сформировать отчет</button>
    <textarea id="reportOutput" placeholder="Здесь будет итоговый отчет..." oninput="saveData()"></textarea>
    <button class="btn-copy" id="copy-report-btn" style="width: 100%; margin-top: 8px;" onclick="copyReport(this)">📋 <span id="txt-btnCopyReport">Копировать весь отчет</span></button>
</div>

<script>
    let currentLang = 'ru';
    let currentMode = 'departure'; 
    let boardingType = 'gate'; 
    let actionHistory = [];
    let redoHistory = [];
    let markCounterDep = 0;
    let markCounterArr = 0;

    let eventTimestamps = {};

    const translations = {
        ru: {
            titleDep: "Посадка",
            titleArr: "Прилет",
            modeDep: "ПОСАДКА",
            modeArr: "ПРИЛЕТ",
            btnClear: "Очистить всё",
            btnUndo: "Удалить действие",
            btnRedo: "Вернуть действие",
            lblClock: "Часы (Местное / UTC):",
            lblFlight: "Номер рейса и тип стоянки:",
            gate: "Гейт",
            remote: "Дальняя стоянка",
            phComm: "Комм.",
            lblChanges: "Изменения:",
            lblPaxCount: "Количество пассажиров:",
            btnReport: "Сформировать отчет",
            btnCopyReport: "Копировать весь отчет",
            reportCopied: "✅ Отчет скопирован!",
            phReport: "Здесь будет итоговый отчет...",
            
            preboarding: "Пребординг",
            toBus: "В автобус",
            full: "Полная",
            busDep1: "1-й кобус уехал",
            busDep2: "2-й кобус уехал",
            busDep3: "3-й кобус уехал",
            busArr1: "1-й кобус уехал",
            busArr2: "2-й кобус уехал",
            busArr3: "3-й кобус уехал",
            mark: "Отметить",
            allAboard: "Все на борту",
            closed: "Закрыли",
            opened: "Открыли",
            allOut: "Все вышли",
            paxText: "Пассажиров",
            noChanges: "б/и"
        },
        kz: {
            titleDep: "Ұшаққа отырғызу",
            titleArr: "Ұшып келу",
            modeDep: "ОТЫРҒЫЗУ",
            modeArr: "ҰШЫП КЕЛУ",
            btnClear: "Барлығын тазалау",
            btnUndo: "Әрекетті жою",
            btnRedo: "Әрекетті қайтару",
            lblClock: "Сағат (Жергілікті / UTC):",
            lblFlight: "Рейс нөмірі және тұрақ түрі:",
            gate: "Гейт",
            remote: "Қашықтағы тұрақ",
            phComm: "Түсініктеме",
            lblChanges: "Өзгерістер:",
            lblPaxCount: "Жолаушылар саны:",
            btnReport: "Есепті қалыптастыру",
            btnCopyReport: "Есепті толық көшіру",
            reportCopied: "✅ Есеп көшірілді!",
            phReport: "Мұнда итоговый есеп болады...",
            
            preboarding: "Алдын ала отырғызу",
            toBus: "Автобусқа",
            full: "Отырғызу басталды",
            busDep1: "1-ші кобус кетті",
            busDep2: "2-ші кобус кетті",
            busDep3: "3-ші кобус кетті",
            busArr1: "1-ші кобус кетті",
            busArr2: "2-ші кобус кетті",
            busArr3: "3-ші кобус кетті",
            mark: "Белгілеу",
            allAboard: "Отырғызу аяқталды",
            closed: "Жабылды",
            opened: "Ашылды",
            allOut: "Бәрі шықты",
            paxText: "Жолаушылар",
            noChanges: "ө/жоқ"
        },
        en: {
            titleDep: "Boarding",
            titleArr: "Arrival",
            modeDep: "BOARDING",
            modeArr: "ARRIVAL",
            btnClear: "Clear All",
            btnUndo: "Undo Action",
            btnRedo: "Redo Action",
            lblClock: "Clock (Local / UTC):",
            lblFlight: "Flight No. & Stand Type:",
            gate: "Gate",
            remote: "Remote Stand",
            phComm: "Comm.",
            lblChanges: "Changes:",
            lblPaxCount: "Passenger Count:",
            btnReport: "Generate Report",
            btnCopyReport: "Copy Full Report",
            reportCopied: "✅ Report Copied!",
            phReport: "Final report will appear here...",
            
            preboarding: "Preboarding",
            toBus: "To Bus",
            full: "General boarding",
            busDep1: "1st Bus Departed",
            busDep2: "2nd Bus Departed",
            busDep3: "3rd Bus Departed",
            busArr1: "1st Bus Departed",
            busArr2: "2nd Bus Departed",
            busArr3: "3rd Bus Departed",
            mark: "Mark",
            allAboard: "Boarding is over",
            closed: "Closed",
            opened: "Opened",
            allOut: "All out",
            paxText: "Passengers",
            noChanges: "n/c"
        }
    };

    function saveData() {
        const state = {
            currentLang,
            currentMode,
            boardingType,
            actionHistory,
            redoHistory,
            markCounterDep,
            markCounterArr,
            eventTimestamps,
            flightNum: document.getElementById('flightNum').value,
            changes: document.getElementById('changes').value,
            paxCount: document.getElementById('paxCount').value,
            reportOutput: document.getElementById('reportOutput').value,
            times: {},
            comments: {}
        };

        const standardIds = [
            'preboarding', 'full', 'busDep1', 'busDep2', 'busDep3', 'allAboard', 'closed',
            'opened', 'busArr1', 'busArr2', 'busArr3', 'allOut'
        ];

        standardIds.forEach(id => {
            const timeElem = document.getElementById(`time-${id}`);
            if (timeElem) state.times[id] = timeElem.innerText;
            const commElem = document.getElementById(`comment-${id}`);
            if (commElem) state.comments[id] = commElem.value;
        });

        for (let i = 1; i <= markCounterDep; i++) {
            const id = `markDep_${i}`;
            const timeElem = document.getElementById(`time-${id}`);
            if (timeElem) state.times[id] = timeElem.innerText;
            const commElem = document.getElementById(`comment-${id}`);
            if (commElem) state.comments[id] = commElem.value;
        }

        for (let i = 1; i <= markCounterArr; i++) {
            const id = `markArr_${i}`;
            const timeElem = document.getElementById(`time-${id}`);
            if (timeElem) state.times[id] = timeElem.innerText;
            const commElem = document.getElementById(`comment-${id}`);
            if (commElem) state.comments[id] = commElem.value;
        }

        try {
            localStorage.setItem('flightLoggerState', JSON.stringify(state));
        } catch (e) {
            console.warn("localStorage недоступен:", e);
        }
    }

    function loadData() {
        let saved = null;
        try {
            saved = localStorage.getItem('flightLoggerState');
        } catch (e) {
            console.warn("Не удалось прочитать localStorage:", e);
        }

        if (!saved) {
            addMarkRow('departure');
            addMarkRow('arrival');
            return;
        }

        try {
            const state = JSON.parse(saved);
            currentLang = state.currentLang || 'ru';
            currentMode = state.currentMode || 'departure';
            boardingType = state.boardingType || 'gate';
            actionHistory = state.actionHistory || [];
            redoHistory = state.redoHistory || [];
            eventTimestamps = state.eventTimestamps || {};

            document.getElementById('flightNum').value = state.flightNum || 'KC622';
            document.getElementById('changes').value = state.changes || '';
            document.getElementById('paxCount').value = state.paxCount || '';
            document.getElementById('reportOutput').value = state.reportOutput || '';

            document.getElementById('markContainerDeparture').innerHTML = '';
            document.getElementById('markContainerArrival').innerHTML = '';
            markCounterDep = 0;
            markCounterArr = 0;

            const targetMarkDep = state.markCounterDep || 1;
            for (let i = 0; i < targetMarkDep; i++) {
                addMarkRow('departure', false);
            }

            const targetMarkArr = state.markCounterArr || 1;
            for (let i = 0; i < targetMarkArr; i++) {
                addMarkRow('arrival', false);
            }

            if (state.times) {
                Object.keys(state.times).forEach(id => {
                    const val = state.times[id];
                    const timeElem = document.getElementById(`time-${id}`);
                    const btnElem = document.getElementById(`btn-${id}`);
                    if (timeElem) timeElem.innerText = val;
                    if (btnElem && val !== '--:--') btnElem.classList.add('active');
                });
            }

            if (state.comments) {
                Object.keys(state.comments).forEach(id => {
                    const commElem = document.getElementById(`comment-${id}`);
                    if (commElem) commElem.value = state.comments[id];
                });
            }

            setBoardingType(boardingType);
            setMode(currentMode);
        } catch (e) {
            console.error("Ошибка парсинга данных:", e);
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode-departure').classList.toggle('active', mode === 'departure');
        document.getElementById('mode-arrival').classList.toggle('active', mode === 'arrival');

        document.getElementById('section-departure').style.display = (mode === 'departure') ? 'block' : 'none';
        document.getElementById('section-arrival').style.display = (mode === 'arrival') ? 'block' : 'none';

        setLanguage(currentLang);
        saveData();
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.btn-lang').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`lang-${lang}`).classList.add('active');

        const t = translations[lang];

        document.getElementById('txt-title').innerText = (currentMode === 'departure') ? t.titleDep : t.titleArr;
        document.getElementById('mode-departure').innerText = t.modeDep;
        document.getElementById('mode-arrival').innerText = t.modeArr;
        document.getElementById('txt-btnClear').innerText = t.btnClear;
        document.getElementById('txt-btnUndo').innerText = t.btnUndo;
        document.getElementById('txt-btnRedo').innerText = t.btnRedo;
        document.getElementById('txt-lblClock').innerText = t.lblClock;
        document.getElementById('txt-lblFlight').innerText = t.lblFlight;
        document.getElementById('btn-gate').innerText = t.gate;
        document.getElementById('btn-remote').innerText = t.remote;
        document.getElementById('txt-lblChanges').innerText = t.lblChanges;
        document.getElementById('txt-lblPaxCount').innerText = t.lblPaxCount;
        document.getElementById('txt-btnReport').innerText = t.btnReport;
        document.getElementById('txt-btnCopyReport').innerText = t.btnCopyReport;
        document.getElementById('reportOutput').placeholder = t.phReport;

        document.querySelectorAll('input[id^="comment-"]').forEach(inp => inp.placeholder = t.phComm);

        document.getElementById('btn-preboarding').innerText = (boardingType === 'remote') ? t.toBus : t.preboarding;
        document.getElementById('btn-full').innerText = t.full;
        document.getElementById('btn-busDep1').innerText = t.busDep1;
        document.getElementById('btn-busDep2').innerText = t.busDep2;
        document.getElementById('btn-busDep3').innerText = t.busDep3;
        document.getElementById('btn-allAboard').innerText = t.allAboard;
        document.getElementById('btn-closed').innerText = t.closed;

        document.getElementById('btn-opened').innerText = t.opened;
        document.getElementById('btn-busArr1').innerText = t.busArr1;
        document.getElementById('btn-busArr2').innerText = t.busArr2;
        document.getElementById('btn-busArr3').innerText = t.busArr3;
        document.getElementById('btn-allOut').innerText = t.allOut;

        for (let i = 1; i <= markCounterDep; i++) {
            const btn = document.getElementById(`btn-markDep_${i}`);
            if (btn) btn.innerText = t.mark;
        }
        for (let i = 1; i <= markCounterArr; i++) {
            const btn = document.getElementById(`btn-markArr_${i}`);
            if (btn) btn.innerText = t.mark;
        }

        if (document.getElementById('reportOutput').value.trim() !== '') {
            generateReport();
        }
        saveData();
    }

    function updateClock() {
        const now = new Date();
        const local = now.toTimeString().substring(0, 8);
        const utcH = String(now.getUTCHours()).padStart(2, '0');
        const utcM = String(now.getUTCMinutes()).padStart(2, '0');
        const utcS = String(now.getUTCSeconds()).padStart(2, '0');
        document.getElementById('liveClock').value = `${local} (${utcH}:${utcM}:${utcS} UTC)`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getFormattedTime() {
        const now = new Date();
        return now.toTimeString().substring(0, 5);
    }

    function addMarkRow(type, shouldSave = true) {
        const isDep = (type === 'departure');
        if (isDep) markCounterDep++; else markCounterArr++;
        
        const count = isDep ? markCounterDep : markCounterArr;
        const prefix = isDep ? 'markDep' : 'markArr';
        const containerId = isDep ? 'markContainerDeparture' : 'markContainerArrival';
        const id = `${prefix}_${count}`;
        const t = translations[currentLang];

        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${id}`;
        row.innerHTML = `
            <button class="btn-status" id="btn-${id}" onclick="recordTime('${id}')">${t.mark}</button>
            <span class="time-display" id="time-${id}">--:--</span>
            <input type="text" id="comment-${id}" placeholder="${t.phComm}" oninput="saveData()">
            <button class="btn-copy" id="copy-btn-${id}" onclick="copyLine('${id}', this)">📋</button>
        `;
        container.appendChild(row);

        if (shouldSave) saveData();
    }

    function setBoardingType(type) {
        boardingType = type;
        const btnPre = document.getElementById('btn-preboarding');
        const busDep = document.getElementById('busBlockDeparture');
        const busArr = document.getElementById('busBlockArrival');
        const t = translations[currentLang];
        
        if (type === 'remote') {
            document.getElementById('btn-remote').classList.add('active');
            document.getElementById('btn-gate').classList.remove('active');
            btnPre.innerText = t.toBus;
            busDep.style.display = 'block';
            busArr.style.display = 'block';
        } else {
            document.getElementById('btn-gate').classList.add('active');
            document.getElementById('btn-remote').classList.remove('active');
            btnPre.innerText = t.preboarding;
            busDep.style.display = 'none';
            busArr.style.display = 'none';
        }
        saveData();
    }

    function recordTime(id) {
        const display = document.getElementById(`time-${id}`);
        const btn = document.getElementById(`btn-${id}`);
        const timeVal = getFormattedTime();
        const nowTs = Date.now();

        const isNewAction = (display.innerText === '--:--');

        actionHistory.push({ 
            id: id, 
            oldTime: display.innerText, 
            newTime: timeVal, 
            oldTimestamp: eventTimestamps[id] || null,
            newTimestamp: nowTs,
            isFirstRecord: isNewAction 
        });
        redoHistory = [];

        display.innerText = timeVal;
        eventTimestamps[id] = nowTs;
        btn.classList.add('active');

        if (id.startsWith('markDep_') && isNewAction) {
            const currentNum = parseInt(id.split('_')[1]);
            if (currentNum === markCounterDep) addMarkRow('departure');
        } else if (id.startsWith('markArr_') && isNewAction) {
            const currentNum = parseInt(id.split('_')[1]);
            if (currentNum === markCounterArr) addMarkRow('arrival');
        }

        saveData();
    }

    function undoLast() {
        if (actionHistory.length === 0) return;
        const lastAction = actionHistory.pop();
        redoHistory.push(lastAction);

        const display = document.getElementById(`time-${lastAction.id}`);
        const btn = document.getElementById(`btn-${lastAction.id}`);
        
        if (display) display.innerText = lastAction.oldTime;
        if (lastAction.oldTimestamp) {
            eventTimestamps[lastAction.id] = lastAction.oldTimestamp;
        } else {
            delete eventTimestamps[lastAction.id];
        }

        if (btn && lastAction.oldTime === '--:--') {
            btn.classList.remove('active');
        }

        if (lastAction.id.startsWith('markDep_') && lastAction.isFirstRecord) {
            const currentNum = parseInt(lastAction.id.split('_')[1]);
            const nextRow = document.getElementById(`row-markDep_${currentNum + 1}`);
            if (nextRow && document.getElementById(`time-markDep_${currentNum + 1}`).innerText === '--:--') {
                nextRow.remove();
                markCounterDep--;
            }
        } else if (lastAction.id.startsWith('markArr_') && lastAction.isFirstRecord) {
            const currentNum = parseInt(lastAction.id.split('_')[1]);
            const nextRow = document.getElementById(`row-markArr_${currentNum + 1}`);
            if (nextRow && document.getElementById(`time-markArr_${currentNum + 1}`).innerText === '--:--') {
                nextRow.remove();
                markCounterArr--;
            }
        }

        saveData();
    }

    function redoLast() {
        if (redoHistory.length === 0) return;
        const action = redoHistory.pop();
        actionHistory.push(action);

        let display = document.getElementById(`time-${action.id}`);
        if (!display && action.id.startsWith('markDep_')) {
            addMarkRow('departure');
            display = document.getElementById(`time-${action.id}`);
        } else if (!display && action.id.startsWith('markArr_')) {
            addMarkRow('arrival');
            display = document.getElementById(`time-${action.id}`);
        }

        const btn = document.getElementById(`btn-${action.id}`);
        if (display) display.innerText = action.newTime;
        eventTimestamps[action.id] = action.newTimestamp;
        if (btn) btn.classList.add('active');

        if (action.id.startsWith('markDep_') && action.isFirstRecord) {
            const currentNum = parseInt(action.id.split('_')[1]);
            if (currentNum === markCounterDep) addMarkRow('departure');
        } else if (action.id.startsWith('markArr_') && action.isFirstRecord) {
            const currentNum = parseInt(action.id.split('_')[1]);
            if (currentNum === markCounterArr) addMarkRow('arrival');
        }

        saveData();
    }

    // ПРЯМАЯ ОЧИСТКА БЕЗ ВСПЛЫВАЮЩИХ ОКОН (РАБОТАЕТ В DOCUMENTS)
    function clearAll() {
        try {
            localStorage.removeItem('flightLoggerState');
        } catch (e) {
            console.warn("localStorage недоступен:", e);
        }

        const ids = [
            'preboarding', 'full', 'busDep1', 'busDep2', 'busDep3', 'allAboard', 'closed',
            'opened', 'busArr1', 'busArr2', 'busArr3', 'allOut'
        ];
        ids.forEach(id => {
            const display = document.getElementById(`time-${id}`);
            if (display) display.innerText = '--:--';
            
            const btn = document.getElementById(`btn-${id}`);
            if (btn) btn.classList.remove('active');
            
            const comm = document.getElementById(`comment-${id}`);
            if (comm) comm.value = '';
        });

        document.getElementById('markContainerDeparture').innerHTML = '';
        document.getElementById('markContainerArrival').innerHTML = '';
        markCounterDep = 0;
        markCounterArr = 0;
        addMarkRow('departure', false);
        addMarkRow('arrival', false);

        document.getElementById('changes').value = '';
        document.getElementById('paxCount').value = '';
        document.getElementById('reportOutput').value = '';
        actionHistory = [];
        redoHistory = [];
        eventTimestamps = {};

        saveData();
    }

    function getLabelText(id) {
        const t = translations[currentLang];
        if (id === 'preboarding') return (boardingType === 'remote') ? t.toBus : t.preboarding;
        if (id === 'allAboard') return t.allAboard;
        if (id.startsWith('markDep_') || id.startsWith('markArr_')) return '';
        return t[id] || '';
    }

    function copyLine(id, btn) {
        const time = document.getElementById(`time-${id}`).innerText;
        const flight = document.getElementById('flightNum').value;
        const commInput = document.getElementById(`comment-${id}`);
        let comment = commInput ? commInput.value.trim() : '';
        
        if (time === '--:--') return;

        const label = getLabelText(id);
        let text = label ? `${flight} ${label} ${time}` : `${flight} ${time}`;
        if (comment) text += ` ${comment}`;

        navigator.clipboard.writeText(text);

        const originalText = btn.innerText;
        btn.innerText = '✅';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerText = originalText;
            btn.classList.remove('copied');
        }, 1200);
    }

    function generateReport() {
        const flight = document.getElementById('flightNum').value;
        const t = translations[currentLang];
        let report = `${flight} - ${currentMode === 'departure' ? t.modeDep : t.modeArr}\n`;

        let activeEvents = [];

        if (currentMode === 'departure') {
            const availableIds = ['preboarding', 'full', 'allAboard', 'closed'];
            if (boardingType === 'remote') {
                availableIds.push('busDep1', 'busDep2', 'busDep3');
            }
            for (let i = 1; i <= markCounterDep; i++) {
                availableIds.push(`markDep_${i}`);
            }

            availableIds.forEach(id => {
                const timeElem = document.getElementById(`time-${id}`);
                if (timeElem && timeElem.innerText !== '--:--') {
                    const commInput = document.getElementById(`comment-${id}`);
                    const comment = commInput ? commInput.value.trim() : '';
                    activeEvents.push({
                        id: id,
                        time: timeElem.innerText,
                        timestamp: eventTimestamps[id] || 0,
                        comment: comment,
                        isCustomMark: id.startsWith('markDep_')
                    });
                }
            });

            activeEvents.sort((a, b) => a.timestamp - b.timestamp);

            activeEvents.forEach(item => {
                const commText = item.comment ? ` ${item.comment}` : '';
                if (item.isCustomMark) {
                    report += `${item.time}${commText}\n`;
                } else {
                    const label = getLabelText(item.id);
                    report += `${label} ${item.time}${commText}\n`;
                }
            });

            const changes = document.getElementById('changes').value.trim();
            report += `${changes ? changes : t.noChanges}\n`;

        } else {
            const availableIds = ['opened', 'allOut'];
            if (boardingType === 'remote') {
                availableIds.push('busArr1', 'busArr2', 'busArr3');
            }
            for (let i = 1; i <= markCounterArr; i++) {
                availableIds.push(`markArr_${i}`);
            }

            availableIds.forEach(id => {
                const timeElem = document.getElementById(`time-${id}`);
                if (timeElem && timeElem.innerText !== '--:--') {
                    const commInput = document.getElementById(`comment-${id}`);
                    const comment = commInput ? commInput.value.trim() : '';
                    activeEvents.push({
                        id: id,
                        time: timeElem.innerText,
                        timestamp: eventTimestamps[id] || 0,
                        comment: comment,
                        isCustomMark: id.startsWith('markArr_')
                    });
                }
            });

            activeEvents.sort((a, b) => a.timestamp - b.timestamp);

            activeEvents.forEach(item => {
                const commText = item.comment ? ` ${item.comment}` : '';
                if (item.isCustomMark) {
                    report += `${item.time}${commText}\n`;
                } else {
                    const label = getLabelText(item.id);
                    report += `${label} ${item.time}${commText}\n`;
                }
            });

            const pax = document.getElementById('paxCount').value.trim();
            if (pax) {
                report += `${t.paxText}: ${pax}\n`;
            }
        }

        document.getElementById('reportOutput').value = report.trim();
        saveData();
    }

    function copyReport(btn) {
        const text = document.getElementById('reportOutput').value;
        if (!text) return;

        navigator.clipboard.writeText(text);

        const t = translations[currentLang];
        const spanBtn = document.getElementById('txt-btnCopyReport');
        const originalText = spanBtn.innerText;
        
        spanBtn.innerText = t.reportCopied;
        btn.classList.add('copied');
        setTimeout(() => {
            spanBtn.innerText = originalText;
            btn.classList.remove('copied');
        }, 1200);
    }

    window.addEventListener('DOMContentLoaded', loadData);
</script>
